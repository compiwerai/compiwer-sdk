[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiwer"
version = "0.1.0"
description = "Compiwer SDK — run Mtrini AI models locally. Build AI locally."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Compiwer AI" }]
keywords = ["ai", "llm", "local", "mtrini", "llama.cpp", "huggingface"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.2"]
transformers = ["transformers>=4.40", "accelerate>=0.30", "torch"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["compiwer[llama,transformers,server,test]"]

[project.scripts]
compiwer = "compiwer.cli.main:app"

[project.urls]
Homepage = "https://github.com/compiwerai/mtrini-workspace"
Repository = "https://github.com/compiwerai/mtrini-workspace"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs network + Hugging Face"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/compiwer/cli/main.py" = ["E402"]  # guarded typer/rich import must run first

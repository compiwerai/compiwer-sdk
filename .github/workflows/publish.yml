# Publish to PyPI on version tags (uses Trusted Publishing — no tokens in CI).
# One-time setup: first `twine upload` manually, then on PyPI add this repo
# as a trusted publisher for project "compiwer".
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
